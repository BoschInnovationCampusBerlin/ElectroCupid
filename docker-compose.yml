services:
  frontend:
    container_name: electrocupid-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
  backend:
    container_name: electrocupid-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
